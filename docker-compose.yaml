services:
  mongodb:
    build:
      context: db
      dockerfile: Dockerfile.test
    container_name: mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/etc/mongodb-keyfile"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=12345
      - MONGO_INITDB_DATABASE=Storage-Base
    ports:
      - "27017:27017"
    volumes:
      - ./db/data:/data/db
      - ./db/test-data:/docker-entrypoint-initdb.d
    networks:
      - app-network

networks:
  app-network:
    driver: bridge