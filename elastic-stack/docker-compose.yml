services:
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - elastic_network

  kibana:
    image: kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch  
    networks:
      - elastic_network
  
  mongo-connector:
    image: python:3.9-alpine
    container_name: mongo-connector
    working_dir: /app
    volumes:
      - ./mongo-connector:/app
    command: >
      sh -c "pip install mongo-connector elastic2-doc-manager pymongo &&
             mongo-connector -m mongodb://root:12345@host.docker.internal:27017 -t http://elasticsearch:9200 -d elastic2_doc_manager --auto-commit-interval=5"
    depends_on:
      - elasticsearch
    networks:
      - elastic_network
    extra_hosts:
      - "host.docker.internal:host-gateway"    


volumes:
  elastic_data:

networks:
  elastic_network:
    driver: bridge
