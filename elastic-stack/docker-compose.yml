services:
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - elastic_network

  kibana:
    image: kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch  
    networks:
      - elastic_network
  
  mongo-connector:
    image: python:3.9-alpine
    container_name: mongo-connector
    working_dir: /app
    command: >
      sh -c "
        pip install 'mongo-connector==3.1.1' 'elasticsearch==7.17.9' 'elastic2-doc-manager==0.3.0' pymongo &&
        sleep 15 &&
        mongo-connector -m mongodb://root:12345@host.docker.internal:27017 -t http://host.docker.internal:9200 -d elastic2_doc_manager --auto-commit-interval=5
      "
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
        
volumes:
  elastic_data:

networks:
  elastic_network:
    driver: bridge
